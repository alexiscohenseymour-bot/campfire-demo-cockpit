<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>A Controller's View of Campfire</title>
<style>
/* Layout: title band; agenda as a step bar; slide stage; "See it in Campfire" cards. Presenter-only items hidden unless body.presenter */
:root{
  --bg:#F1EFED;--card:#FFFFFF;--fg:#13212C;--fg2:#264759;--brand:#36677D;--brand-ink:#FFFFFF;--line:#E7F2F5;--soft:#F5FAFC;--accent:#94BFCE;
  --ok:#86B596;--warn:#E2C06B;--bad:#FF8675;--chip-ink:#13212C;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A22;--card:#16252F;--fg:#E7F2F5;--fg2:#B7CFD8;--brand:#5C93A8;--line:#264759;--soft:#1B2E3A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A22;--card:#16252F;--fg:#E7F2F5;--fg2:#B7CFD8;--brand:#5C93A8;--line:#264759;--soft:#1B2E3A;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
.wrap>*{min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45}
.wrap{max-width:1200px;margin:0 auto;padding-block:1.25rem 2.5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:1.25rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 3px rgba(19,33,44,.1)}
/* header */
.hd{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.5rem 1.5rem}
.hd .eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.hd h1{margin:.15rem 0 0;font-size:1.6rem;font-weight:600;text-wrap:balance;line-height:1.2}
.hd .by{margin:.25rem 0 0;color:var(--fg2)}
.hd .grow{flex:1;min-width:260px}
/* agenda */
.agenda{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem;padding:.5rem}
.step{border:0;background:transparent;text-align:left;font:inherit;color:var(--fg);padding:.6rem .75rem;border-radius:6px;cursor:pointer;display:grid;gap:.1rem;min-width:0}
.step:hover{background:var(--soft)}
.step .n{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
.step b{font-weight:600;font-size:.95rem}
.step small{color:var(--fg2);font-size:.8rem}
.step.on{background:var(--brand);color:var(--brand-ink)}.step.on .n,.step.on small{color:var(--brand-ink);opacity:.9}
/* stage */
.stage{padding:1rem}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;margin-bottom:.75rem}
.count{font-weight:600;font-variant-numeric:tabular-nums;min-width:6.5rem;text-align:center}
.bar .sp{flex:1}
.btn{font:inherit;font-size:.85rem;font-weight:500;border-radius:6px;padding:.4rem .9rem;cursor:pointer;border:1px solid var(--brand);background:var(--card);color:var(--brand)}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.step:focus-visible,.thumb:focus-visible,a:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.slidewrap{background:#0b1419;border-radius:6px;overflow:hidden;aspect-ratio:16/9;max-width:100%}
.slidewrap img{width:100%;height:100%;object-fit:contain;display:block}
.slidewrap:fullscreen{border-radius:0;aspect-ratio:auto;background:#000}
.thumbs{display:flex;gap:.6rem;overflow-x:auto;padding:.75rem .1rem .1rem}
.thumb{flex:0 0 auto;width:120px;border:2px solid transparent;border-radius:6px;padding:2px;background:transparent;cursor:pointer;color:var(--fg2);font:inherit;font-size:.72rem;text-align:center}
.thumb img{width:100%;border-radius:4px;display:block;margin-bottom:3px}
.thumb.on{border-color:var(--brand);color:var(--fg);font-weight:600}
/* see it */
.show{padding:1rem 1rem 1.25rem}
.show h2{margin:0;font-size:1.1rem;color:var(--brand);font-weight:600}
.show .lead{margin:.2rem 0 1rem;color:var(--fg2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.9rem}
.c{border:1px solid var(--line);border-radius:8px;padding:.9rem;display:flex;flex-direction:column;gap:.4rem;background:var(--card);min-width:0}
.c.ember{border-left:4px solid var(--brand)}
.tag{align-self:flex-start;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:.15rem .55rem;border-radius:10px;background:var(--ok);color:var(--chip-ink)}
.tag.em{background:var(--accent)}.tag.wk{background:var(--warn)}.tag.bk{background:var(--line);color:var(--fg2)}
.c h3{margin:0;font-size:.98rem;font-weight:600;color:var(--fg)}
.c p{margin:0;color:var(--fg2);font-size:.88rem}
.q{font-size:.88rem;color:var(--fg);background:var(--soft);border-radius:4px;padding:.5rem .65rem}
.foot{margin-top:auto;padding-top:.35rem;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.open{margin-left:auto;color:var(--brand);font-weight:600;text-decoration:none;font-size:.85rem}
.open:hover{text-decoration:underline}
.live{margin-left:auto;font-size:.8rem;color:var(--fg2)}
/* presenter only */
.pres{display:none}
body.presenter .pres{display:block}
body.presenter .pres.flex{display:flex}
.c.backup{display:none}body.presenter .c.backup{display:flex}
.notes{margin-top:.75rem;background:var(--scen,#FBF6E8);border-left:3px solid var(--warn);border-radius:4px;padding:.6rem .8rem;color:#13212C;font-size:.9rem}
.say{font-size:.82rem;font-style:italic;color:#13212C;background:#FBF6E8;border-radius:4px;padding:.45rem .6rem}
.ptools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#13212C;color:#fff;border-radius:8px;padding:.5rem .75rem;align-items:center;gap:.75rem;flex-wrap:wrap}
.ptools b{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:#E2C06B}
.clock{font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.cue{font-size:.82rem;opacity:.85;flex:1;min-width:160px}
.ptools .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);padding:.25rem .7rem}
.setlink{display:flex;gap:.35rem}
.setlink input{flex:1;min-width:0;font:inherit;font-size:.8rem;padding:.3rem .45rem;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--fg)}
.linkbtn{font:inherit;font-size:.78rem;border:0;background:transparent;color:var(--fg2);cursor:pointer;padding:0;text-decoration:underline}
.pfoot{display:flex;justify-content:flex-end}
.ptoggle{font:inherit;font-size:.75rem;border:0;background:transparent;color:var(--fg2);opacity:.55;cursor:pointer}
.ptoggle:hover{opacity:1}
.toast{position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.5rem .9rem;border-radius:6px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none}
@media (max-width:700px){.agenda{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="ptools pres flex" id="ptools">
    <b>Presenter</b>
    <span class="clock" id="clock">0:00 / 15:00</span>
    <span class="cue" id="cue">Start the timer when you begin.</span>
    <button class="btn" id="tgo" type="button">Start</button>
    <button class="btn" id="treset" type="button">Reset</button>
    <button class="btn" id="pexit" type="button">Hide (P)</button>
  </div>

  <header class="hd">
    <div class="grow">
      <div class="eyebrow">Case study</div>
      <h1>From building the report to running the business</h1>
      <p class="by">A controller's view of Campfire &middot; Alexis Seymour, CPA</p>
    </div>
  </header>

  <nav class="panel agenda" id="agenda" aria-label="Agenda"></nav>

  <section class="panel stage" aria-label="Slides">
    <div class="bar">
      <button class="btn" id="prev" type="button">Previous</button>
      <span class="count" id="count">Slide 1 of 6</span>
      <button class="btn pri" id="next" type="button">Next</button>
      <span class="sp"></span>
      <button class="btn" id="fs" type="button">Fullscreen</button>
    </div>
    <div class="slidewrap" id="wrap"><img id="slide" alt=""></div>
    <div class="notes pres" id="notes"></div>
    <div class="thumbs" id="thumbs"></div>
  </section>

  <section class="panel show" aria-label="See it in Campfire">
    <h2 id="showtitle">See it in Campfire</h2>
    <p class="lead" id="showlead"></p>
    <div class="grid" id="cards"></div>
  </section>

  <div class="pfoot"><button class="ptoggle" id="ptoggle" type="button" title="Presenter mode (P)">&#9679;</button></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

 "I'm a CPA. Ten years as controller of a software company, then controller of a PE-backed services company through an acquisition that doubled us overnight. My team spent its days reconciling, rebuilding schedules, and maintaining spreadsheets just to produce the report. That hamster wheel is a big part of why I stepped away from finance leadership. Campfire uses AI to take on that work, so the team can understand the business.",
 "This is the story underneath everything I'll show you. AI takes the repetitive work that keeps finance in the weeds, so the team can use its skills to understand the business and make decisions, not just create the report.",
 "Two outcomes, the two problems that cost me the most sleep as a controller and CFO. Revenue you can defend, and a close you can explain.",
 "You're going to see a bundled contract, including a mid-term upsell, become an audit-ready revenue schedule without touching a spreadsheet. Close with: Now those days go to asking why revenue moved, not proving that it did.",
 "You're going to see where the close stands at a glance, and get a variance explanation a board would accept, in seconds. Close with: Instead of spending the close building the report, I get to spend it on what the report is telling me.",
 "Let AI do the reconciling, the schedules, and the first draft of the analysis. My team gets its time back to understand the business. If I'd had Campfire back then, I might still be leading a finance team. Then ask the panel the question on screen, and stop talking."
];

var LS='cf-cockpit-cust-v1',pins={},presenter=false;
try{var sv=JSON.parse(localStorage.getItem(LS)||'{}');pins=sv.pins||{};presenter=!!sv.p;}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify({pins:pins,p:presenter}));}catch(e){}}
function $(i){return document.getElementById(i);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(m){var t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity=0;},1800);}
var cur=0,seg=0;
function segOf(i){for(var s=0;s<SEGS.length;s++)if(SEGS[s].slides.indexOf(i)>-1)return s;return 0;}
function renderAgenda(){$('agenda').innerHTML=SEGS.map(function(s,i){return '<button type="button" class="step'+(i===seg?' on':'')+'" data-s="'+i+'"><span class="n">Part '+(i+1)+'</span><b>'+esc(s.name)+'</b><small>'+s.dur+'</small></button>';}).join('');}
function renderSlide(){$('slide').src=SLIDES[cur];$('slide').alt='Slide '+(cur+1);$('count').textContent='Slide '+(cur+1)+' of '+SLIDES.length;
  $('notes').innerHTML='<b>Say:</b> '+esc(NOTES[cur]);
  [].forEach.call(document.querySelectorAll('.thumb'),function(t,i){t.classList.toggle('on',i===cur);});
  $('prev').disabled=cur===0;$('next').disabled=cur===SLIDES.length-1;}
function card(c,i){
  var u=c.pin?pins[c.pin]:(c.url?CF+c.url:null);
  var cls='c'+(c.ember!=null?' ember':'')+(c.backup?' backup':'');
  var tag=c.backup?'<span class="tag bk">Backup</span>':c.ember!=null?'<span class="tag em">Ember AI</span>':c.pin?'<span class="tag'+(u?'':' wk')+'">'+(u?'Live in Campfire':'Live walkthrough')+'</span>':'<span class="tag'+(c.tag==='Your turn'?' wk':c.tag==='Ember AI'?' em':'')+'">'+esc(c.tag||'Live in Campfire')+'</span>';
  var h='<div class="'+cls+'">'+tag+'<h3>'+esc(c.t)+'</h3><p>'+esc(c.d)+'</p>';
  if(c.ember)h+='<div class="q">"'+esc(c.ember)+'"</div>';
  if(c.say)h+='<div class="say pres">'+esc(c.say)+'</div>';
  h+='<div class="foot">';
  if(c.ember!=null){if(c.ember)h+='<button class="btn pres" type="button" data-copy="'+i+'">Copy question</button>';h+='<a class="open" href="'+CF+'/v2/ember-studio/new" target="_blank" rel="noopener">Open Ember &rarr;</a>';}
  else if(u){h+='<a class="open" href="'+esc(u)+'" target="_blank" rel="noopener">Open in Campfire &rarr;</a>';}
  else if(c.pin){h+='<span class="live">Shown live</span>';}
  h+='</div>';
  if(c.pin)h+='<div class="pres"><div class="setlink" hidden><input id="pin-'+seg+'-'+i+'" type="url" placeholder="Paste the Campfire URL" value="'+esc(pins[c.pin]||'')+'"><button class="btn" type="button" data-save="'+c.pin+'">Save</button></div><button class="linkbtn" type="button" data-edit="1">'+(pins[c.pin]?'Change link':'Set link')+'</button></div>';
  return h+'</div>';}
function renderCards(){var s=SEGS[seg];$('showtitle').textContent=s.title;$('showlead').textContent=s.lead;$('cards').innerHTML=s.cards.map(card).join('');}
function go(i){cur=Math.max(0,Math.min(SLIDES.length-1,i));var ns=segOf(cur),ch=ns!==seg;seg=ns;renderSlide();if(ch){renderAgenda();renderCards();}}
$('thumbs').innerHTML=SLIDES.map(function(s,i){return '<button type="button" class="thumb" data-i="'+i+'"><img src="'+s+'" alt="">Slide '+(i+1)+'</button>';}).join('');
$('thumbs').onclick=function(e){var b=e.target.closest('[data-i]');if(b)go(+b.getAttribute('data-i'));};
$('agenda').onclick=function(e){var b=e.target.closest('[data-s]');if(!b)return;seg=+b.getAttribute('data-s');cur=SEGS[seg].slides[0];renderAgenda();renderSlide();renderCards();};
$('prev').onclick=function(){go(cur-1);};$('next').onclick=function(){go(cur+1);};
function fs(){var w=$('wrap');if(document.fullscreenElement){document.exitFullscreen&&document.exitFullscreen();}else if(w.requestFullscreen){w.requestFullscreen().catch(function(){toast('Fullscreen is not available inside this frame');});}else toast('Fullscreen is not available inside this frame');}
$('fs').onclick=fs;
function setP(v){presenter=v;document.body.classList.toggle('presenter',v);save();}
$('ptoggle').onclick=function(){setP(!presenter);};$('pexit').onclick=function(){setP(false);};
document.addEventListener('keydown',function(e){if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(cur+1);}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1);}
  if(e.key==='f'||e.key==='F')fs();
  if(e.key==='p'||e.key==='P')setP(!presenter);});
$('cards').onclick=function(e){var c=SEGS[seg].cards,b;
  if(b=e.target.closest('[data-copy]')){var txt=c[+b.getAttribute('data-copy')].ember;try{navigator.clipboard.writeText(txt).then(function(){toast('Question copied');},function(){toast('Copy blocked. Select the text instead.');});}catch(x){toast('Copy blocked. Select the text instead.');}}
  if(b=e.target.closest('[data-edit]')){var box=b.parentNode.querySelector('.setlink');box.hidden=!box.hidden;if(!box.hidden)box.querySelector('input').focus();}
  if(b=e.target.closest('[data-save]')){var k=b.getAttribute('data-save'),v=b.parentNode.querySelector('input').value.trim();
    if(v&&!/^https:\/\/app\.meetcampfire\.com\//.test(v)){toast('Use a link that starts with https://app.meetcampfire.com/');return;}
    if(v)pins[k]=v;else delete pins[k];save();renderCards();toast(v?'Link saved':'Link cleared');}};
var start=null,acc=0;
function el(){return acc+(start?Date.now()-start:0);}
function tick(){var ms=el(),s=Math.floor(ms/1000),m=s/60,end=SEGS[seg].end;
  $('clock').textContent=Math.floor(s/60)+':'+('0'+s%60).slice(-2)+' / 15:00';
  var cue;if(!start&&!acc)cue='Start the timer when you begin.';else if(m>15)cue='Over time. Wrap up now.';else if(m>13)cue='Go to slide 6 and the panel question.';else cue=(m>end?'Behind: ':'On pace: ')+SEGS[seg].name+' ends at '+Math.floor(end)+':'+(end%1?'30':'00')+'.';
  $('cue').textContent=cue;$('clock').style.color=m>15?'#FF8675':m>13?'#E2C06B':'#fff';}
setInterval(tick,500);
$('tgo').onclick=function(){if(start){acc=el();start=null;this.textContent='Resume';}else{start=Date.now();this.textContent='Pause';}tick();};
$('treset').onclick=function(){start=null;acc=0;$('tgo').textContent='Start';tick();};
setP(presenter);renderAgenda();renderSlide();renderCards();tick();
</script>
